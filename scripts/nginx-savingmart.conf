# Nginx Server Block for SavingMart (savingmart.dk)
# Location: /etc/nginx/sites-available/savingmart.dk

server {
    listen 80;
    listen [::]:80;
    server_name savingmart.dk www.savingmart.dk;

    # Allow large uploads for product images if needed
    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Next.js Static Asset Caching
    location /_next/static/ {
        alias /var/www/savemart/.next/static/;
        expires 365d;
        access_log off;
    }

    # Reverse proxy all web traffic to local Next.js instance on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
